<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Classification using Julia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #224cff, #020817 55%);
      color: #f9fafb;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(to right, rgba(10, 37, 64, 0.95), rgba(15, 23, 42, 0.9));
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .tagline {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: radial-gradient(circle at top left, #1e40af, #020617);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }

    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      background: rgba(15, 118, 110, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .upload-box {
      border-radius: 18px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 18px 18px 20px;
      background: radial-gradient(circle at top left, rgba(30, 64, 175, 0.6), rgba(15, 23, 42, 0.9));
      margin-bottom: 18px;
    }

    .upload-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: linear-gradient(to right, #2563eb, #4f46e5);
      color: #f9fafb;
      font-size: 13px;
      cursor: pointer;
      border: none;
      outline: none;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.55);
      transition: transform 0.09s ease, box-shadow 0.09s ease;
    }

    .file-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.7);
    }

    #image-input {
      display: none;
    }

    .filename {
      font-size: 13px;
      color: #e5e7eb;
      opacity: 0.85;
    }

    .btn-primary {
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.6);
      background: rgba(15, 23, 42, 0.7);
      color: #e5e7eb;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.09s ease, box-shadow 0.09s ease;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.8);
    }

    .btn-primary:hover {
      background: rgba(37, 99, 235, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.8);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .prediction {
      font-size: 14px;
      margin-top: 8px;
    }

    .prediction span.label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 26px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      font-size: 13px;
      margin-left: 6px;
      padding: 0 10px;
    }

    .error {
      font-size: 12px;
      color: #f97373;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      padding-bottom: 16px;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Image Classification using Julia</h1>
      <div class="tagline">CIFAR-10 · Flux.jl · MLDatasets · Project by Akriti</div>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <div class="status-dot"></div>
        <div class="pill">Live Demo · Upload & Classify</div>
      </div>

      <h2>Upload an image to classify</h2>

      <div class="upload-box">
        <div class="upload-row" style="margin-bottom: 10px;">
          <label class="file-label">
            📁 Choose image
            <input id="image-input" type="file" accept="image/*" />
          </label>
          <span class="filename" id="filename-text">No file selected</span>
        </div>

        <div class="upload-row">
          <button id="classify-btn" class="btn-primary">Classify image</button>
        </div>

        <p class="prediction">
          Prediction:
          <span class="label" id="prediction-text">none</span>
        </p>

        <p class="error" id="error-text" style="display:none;"></p>
      </div>
    </section>
  </main>

  <footer>
    © 2025 Image Classification using Julia — Academic Project by Akriti
  </footer>

  <script>
    const fileInput      = document.getElementById("image-input");
    const fileNameSpan   = document.getElementById("filename-text");
    const classifyBtn    = document.getElementById("classify-btn");
    const predictionSpan = document.getElementById("prediction-text");
    const errorText      = document.getElementById("error-text");

    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files.length > 0) {
        fileNameSpan.textContent = fileInput.files[0].name;
      } else {
        fileNameSpan.textContent = "No file selected";
      }
    });

    classifyBtn.addEventListener("click", async () => {
      errorText.style.display = "none";
      predictionSpan.textContent = "loading…";
      classifyBtn.disabled = true;

      try {
        // Talk to Julia server on the SAME port (8010)
        const resp = await fetch("/predict");
        const data = await resp.json();
        predictionSpan.textContent = data.label ?? "unknown";

      } catch (err) {
        predictionSpan.textContent = "error";
        errorText.textContent = "Could not reach Julia server. Is it running on port 8010?";
        errorText.style.display = "block";
      } finally {
        classifyBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
